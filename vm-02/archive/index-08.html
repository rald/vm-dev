<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pantasya Virtual Machine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="pane">
        <h3>Source Code</h3>
        <textarea id="source"></textarea>
        <div class="controls">
            <button id="runBtn" onclick="toggleRun()">RUN</button>
            <button id="assembleBtn" onclick="assembleCode()">ASSEMBLE</button>
            <label class="upload-btn" for="fileInput">UPLOAD</label>
            <input type="file" id="fileInput" accept=".asm,.txt" onchange="uploadFile(event)">
        </div>
    </div>
    
    <div class="pane">
        <h3>Canvas</h3>
        <canvas id="screen" width="128" height="128"></canvas>
    </div>
</div>

<script src="vm.js"></script>

</body>
</html>
